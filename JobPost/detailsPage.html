<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule="" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap" rel="stylesheet">
  <title>Job Details</title>

  <style>
    body {
      font-family: Poppins, Arial, sans-serif;
    }

    #jobDetails {
      background-color: white;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      padding: 20px;
      margin: 50px auto;
      width: 80%;
      border-radius: 10px;
    }

    h2 {
      margin-top: 0;
    }

    p {
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <h1>Job Post Details</h1>
  <div id="jobDetails">Loading...</div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const urlParams = new URLSearchParams(window.location.search);
      const jobPostId = urlParams.get('jobPostId');

      if (jobPostId) {
        fetchJobPostDetails(jobPostId);
      } else {
        document.getElementById('jobDetails').innerHTML = '<p>Error: Job Post ID not found.</p>';
      }
    });

    function formatDate(dateString) {
      const date = new Date(dateString);
      const day = String(date.getDate()).padStart(2, '0');
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const year = date.getFullYear();
      return `${day}-${month}-${year}`;
    }

    function fetchJobPostDetails(jobPostId) {
      const url = `https://reevaltech.com/scripts/getJobPostDetailsService.php?jobPostId=${jobPostId}`;

      fetch(url)
        .then(response => response.json())
        .then(data => {

          const location = `${data.CityName || 'City not specified'}, ${data.StateName || 'State not specified'}, ${data.CountryName || 'Country not specified'}`;

          const formattedValidity = data.JobPostValidity ? formatDate(data.JobPostValidity) : 'Date not specified';

          document.getElementById('jobDetails').innerHTML = `
            <h2>${data.JobPostTitle}</h2>
            <p><strong>Company Name:</strong> ${data.JobPostCompanyName}</p>
            <p><strong>Location:</strong> ${location}</p>
            <p><strong>Experience:</strong> ${data.JobPostExpReqFrom || 0} - ${data.JobPostExpReqTo || 0} yrs</p>
            <p><strong>Employment Type:</strong> ${data.JobPostWorkTypeName}</p>
            <p><strong>Salary Range:</strong> ${data.JobPostPackageDetails}</p>
            <p><strong>Contact Details:</strong> ${data.JobPostContactDetails}</p>
            <p><strong>Valid Upto:</strong> ${data.formattedValidity}</p>
            <p><strong>Job Description:</strong> ${data.JobPostDescription}</p>
          `;
        })
        .catch(error => console.error('Error fetching job post details:', error));
    }
  </script>
</body>
</html>
