<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Details</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }

    #jobDetails {
      background-color: white;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      padding: 20px;
      margin: 50px auto;
      width: 80%;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h1>Job Post Details</h1>
  <div id="jobDetails">Loading...</div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const urlParams = new URLSearchParams(window.location.search);
      const jobPostId = urlParams.get('jobPostId');

      if (jobPostId) {
        fetchJobPostDetails(jobPostId);
      } else {
        document.getElementById('jobDetails').innerHTML = '<p>Error: Job Post ID not found.</p>';
      }
    });

    function fetchJobPostDetails(jobPostId) {
      const url = `getJobPostDetailsService.php?jobPostId=${jobPostId}`;

      fetch(url)
        .then(response => response.json())
        .then(data => {
          document.getElementById('jobDetails').innerHTML = `
            <h2>${data.title}</h2>
            <p><strong>Location:</strong> ${data.location}</p>
            <p><strong>Experience:</strong> ${data.experienceYears} Years ${data.experienceMonths} Months</p>
            <p><strong>Skills:</strong> ${data.skills}</p>
            <p><strong>Posted on:</strong> ${data.postedDate}</p>
            <p><strong>Job Description:</strong> ${data.description}</p>
          `;
        })
        .catch(error => console.error('Error fetching job post details:', error));
    }
  </script>
</body>
</html>
