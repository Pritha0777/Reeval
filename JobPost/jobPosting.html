<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <style>
            body {
              margin: 0;
              font-family: Arial, Helvetica, sans-serif;
              font-size: 1rem;
            }
            
            .topnav {
              overflow: hidden;
              background-color: #333;
            }
            
            .topnav a {
              float: left;
              color: #f2f2f2;
              text-align: center;
              padding: 14px 16px;
              text-decoration: none;
              font-size: 17px;
            }
            
            .topnav a:hover {
              background-color: #ddd;
              color: black;
            }
            
            .topnav a.active {
              background-color: #04AA6D;
              color: white;
            }
            
            tr:nth-child(even) {background: #ddd}
            tr:nth-child(odd) {background: #eee}
            tr:nth-child(1) {background: #eee}
            
            * {
            box-sizing: border-box;
            }

            /* Initial button style */
            button{
                background-color: #007bff;  /* Original color */
                color: white;
                padding: 10px 20px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 16px;
                margin: 0 auto;  /* Centers the button */
                text-align: center;
            }

            /* Hover effect */
            button:hover {
                background-color: green;  /* Color on hover */
            }


            .form-container {
                width: 90%;
                max-width: 700px;
                margin: 20px auto;
                padding: 20px;
                border: 1px solid #ccc;
                border-radius: 10px;
                box-shadow: 0 0 10px rgba(0,0,0,0.1);
            }
            .form-container h2 {
                text-align: center;
                margin-bottom: 20px;
                font-size: 1.5rem;
                background-color: #f2f2f2;
                padding: 10px;
                border-radius: 5px;
            }
            .form-group {
                display: flex;
                align-items: center;
                margin-bottom: 15px;
                font-size: 1rem;
            }
            .form-group label {
                width: 30%;
                padding-right: 10px;
                font-weight: bold;
                font-size: 0.9rem;
            }
            .form-group .colon {
                margin-right: 10px;
                font-weight: bold;
            }
            .form-group input, .form-group select, .form-group textarea {
                width: 65%;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 5px;
                font-size: 1rem;
            }
            .form-group textarea {
                resize: vertical;
            }
            .form-group input[type="submit"] {
                width: 100%;
                background-color: #007bff;
                color: white;
                font-size: 1.1rem;
                cursor: pointer;
            }
            .form-group input[type="submit"]:hover {
                background-color: #45a049;
            }
            /* Responsive adjustments */
            @media (max-width: 768px) {
                .form-container {
                    width: 95%;
                }
                .form-group input, .form-group textarea {
                    font-size: 0.9rem;
                }
                .form-group label {
                    font-size: 0.85rem;
                }
                .form-group input[type="submit"] {
                    font-size: 1rem;
                }
                .form-group .job-description {
                    font-size: 0.9rem;
                }
            }
            @media (max-width: 480px) {
                .form-group {
                    font-size: 0.7rem; 
                }
                .form-group input, .form-group textarea {
                    font-size: 0.8rem;
                }
                .form-group input[type="submit"] {
                    font-size: 0.9rem;
                }
                .form-group .job-description {
                    font-size: 0.8rem;
                }
            }
        </style>
        <script type="text/javascript" src="jquery-3.7.1.js"></script>
        <script> 
        $(function(){
          $("#includedContent").load("menu.html"); 
        });
        </script> 
        <script type="text/javascript">
            $(document).ready(function () {

                fetch("https://reevaltech.com/scripts/getJobPostWorkTypeService.php")
                    .then(response => response.json())
                    .then(data => {
                        console.log("Fetched work types:", data); // Log the fetched data
        
                        const workTypes = JSON.parse(data.data); 
        
                        if (Array.isArray(workTypes)) { 
                            const workTypeSelect = document.getElementById("workType");
                            workTypes.forEach(workType => {
                                const option = document.createElement("option");
                                option.value = workType.JobPostWorkTypeID; 
                                option.textContent = workType.JobPostWorkTypeName; 
                                workTypeSelect.appendChild(option);
                            });
                        } else {
                            console.error("Expected an array but got:", workTypes);
                        }
                    })
                    .catch(error => console.error("Error fetching work types:", error));

                fetch('https://reevaltech.com/scripts/listOfCityService.php')
                    .then(response => response.json())
                    .then(responseData => {
                        const citySelect = document.getElementById('cityId');
        
                        let citiesData = JSON.parse(responseData.data);
        
                        if (Array.isArray(citiesData) && citiesData.length > 0) {
                            citiesData.forEach(city => {
                                const option = document.createElement('option');
                                option.value = city.CityID;
                                option.text = `${city.CityName}, ${city.StateName}, ${city.CountryName}`;
                                citySelect.add(option);
                            });
                        } else {
                            console.error('No cities returned');
                        }
                    })
                    .catch(error => console.error('Error fetching city data:', error));

                const today = new Date().toISOString().split("T")[0]; // Today's date
                document.getElementById("startDate").setAttribute("min", today);
                document.getElementById("endDate").setAttribute("min", today);
        
                // Set minimum end date based on start date
                document.getElementById("startDate").addEventListener("change", function() {
                    const startDate = this.value;
                    document.getElementById("endDate").setAttribute("min", startDate);
                    document.getElementById("endDate").value = ""; // Clear if start date changes
                });

                
                $("button").click(function (e) {
                    console.log("inside the jobForm click listener");

                    event.preventDefault(); // Prevent default form submission

                    console.log("inside the jobForm click listener 2");
                    
                    // Get the start date and end date 
                    const startDateInput = document.getElementById('startDate').value;
                    const endDateInput = document.getElementById('endDate').value;

                    // Convert dates to ISO 8601 format
                    const startDate = new Date(startDateInput).toISOString().split('T')[0];  // For example: "2024-10-21T00:00:00.000Z"
                    const endDate = new Date(endDateInput).toISOString().split('T')[0];      
                    
                    const formDataObject = {
                        LoggedINUserID: 0, //  hardcoded
                        JobPostTitle: $("#jobTitle").prop('value'),
                        JobPostCompanyName: $("#companyName").prop('value'),
                        JobPostCityID: $("#cityId").prop('value'),
                        JobPostWorkTypeID: $("#workType").prop('value'),
                        JobPostDescription: $("#jobDescription").prop('value'),
                        JobPostExpReqFrom: $("#expFrom").prop('value'),
                        JobPostExpReqTo: $("#expTo").prop('value'),
                        JobPostPackageDetails: $("#package").prop('value'),
                        JobPostContactDetails: $("#contact").prop('value'),
                        JobPostValidity: new Date($("#endDate").prop('value')).toISOString().split('T')[0]
                    };
                    const formDataJson = JSON.stringify(formDataObject);
                    const params = new URLSearchParams(formDataJson).toString();

                    console.log('FormData:', formDataJson);

                    $.ajax({
                        type: "GET",
                        url: 'https://dashboard.reevaltech.com/scripts/createJobPostService.php',
                        data: { 
                            "LoggedINUserID": 0, //  hardcoded
                            "JobPostTitle": $("#jobTitle").prop('value'),
                            "JobPostCompanyName": $("#companyName").prop('value'),
                            "JobPostCityID": $("#cityId").prop('value'),
                            "JobPostWorkTypeID": $("#workType").prop('value'),
                            "JobPostDescription": $("#jobDescription").prop('value'),
                            "JobPostExpReqFrom": $("#expFrom").prop('value'),
                            "JobPostExpReqTo": $("#expTo").prop('value'),
                            "JobPostPackageDetails": $("#package").prop('value'),
                            "JobPostContactDetails": $("#contact").prop('value'),
                            "JobPostValidity": new Date($("#endDate").prop('value')).toISOString().split('T')[0]
                        },
                        contentType: "application/json; charset=utf-8",
                        dataType: "json",
                        success: successFunc,
                        error: errorFunc
                    });

                });
            
                function successFunc(data, status) {
                    console.log('success data==>',data)
                }
            
                function errorFunc() {
                    console.log('error')
                }
            });
        </script>
    </head>
    </body>
    <div id="includedContent"></div>
    <div class="form-container">
        <h2>Job Post Form</h2>
        <form id="jobForm">
            <div class="form-group">
                <label for="jobTitle">Job Post Title</label>
                <span class="colon">:</span>
                <input type="text" id="jobTitle" name="jobTitle" required>
            </div>
    
            <div class="form-group">
                <label for="companyName">Company Name</label>
                <span class="colon">:</span>
                <input type="text" id="companyName" name="companyName" required>
            </div>
    
            <div class="form-group">
                <label for="cityId">City, State</label>
                <span class="colon">:</span>
                <select id="cityId" name="cityId" required>
                    <option value="">Select City</option>
                </select>
            </div>
    
            <div class="form-group">
                <label for="workType">Work Type</label>
                <span class="colon">:</span>
                <select id="workType" name="workType" required>
                    <option value="">Select Work Type</option>
                </select>
            </div>
    
            <div class="form-group">
                <label for="jobDescription">Job Description</label>
                <span class="colon">:</span>
                <textarea id="jobDescription" name="jobDescription" rows="5" required></textarea>
                    <script>
                        const jobDescriptionTextarea = document.getElementById('jobDescription');

                        // Add a listener for the 'keypress' event
                        jobDescriptionTextarea.addEventListener('keypress', function (e) {
                            if (e.key === 'Enter') {
                                e.preventDefault();
                            
                                const cursorPosition = this.selectionStart;
                                const currentText = this.value;

                                // Set the value with a bullet point and a newline
                                this.value = currentText.substring(0, cursorPosition) + '\n• ' + currentText.substring(cursorPosition);
                                
                                // Move the cursor to the end of the new bullet point
                                this.selectionStart = this.selectionEnd = cursorPosition + 3; // +3 to account for the newline and bullet
                            }
                        });

                        jobDescriptionTextarea.addEventListener('focus', function() {
                            if (this.value.trim() === '') {
                                this.value = '• '; // Start with a bullet point
                                this.selectionStart = this.selectionEnd = this.value.length; 
                            }
                        });
                        </script>
            </div>
    
            <div class="form-group">
                <label for="expFrom">Experience Required (From)</label>
                <span class="colon">:</span>
                <input type="number" id="expFrom" name="expFrom" min="0" required>
            </div>
    
            <div class="form-group">
                <label for="expTo">Experience Required (To)</label>
                <span class="colon">:</span>
                <input type="number" id="expTo" name="expTo" min="0" required>
            </div>
    
            <div class="form-group">
                <label for="package">Salary Package</label>
                <span class="colon">:</span>
                <input type="text" id="package" name="package" required>
            </div>
    
            <div class="form-group">
                <label for="contact">Contact Details</label>
                <span class="colon">:</span>
                <input type="text" id="contact" name="contact" required>
            </div>
    
            <div class="form-group">
                <label for="startDate">Start Date</label>
                <span class="colon">:</span>
                <input type="date" id="startDate" name="startDate" required>
            </div>
    
            <div class="form-group">
                <label for="endDate">End Date</label>
                <span class="colon">:</span>
                <input type="date" id="endDate" name="endDate" required>
            </div>
    
            <div class="form-group">
                <!-- <input type="submit" value="Submit Job Post"> -->
                <button style="padding-left:16px" id="btn" data-value="1">Submit Job Post</button>
            </div>
        </form>
    </div>
    
    <script type="text/javascript" src="jquery-3.7.1.js"></script>
    </body>   
</html>
