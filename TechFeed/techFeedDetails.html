<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule="" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap" rel="stylesheet">
    <title>Tech Feed Details</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            padding: 20px;
        }
        .detail-container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            background-color: #fff;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        h2 {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }
        p {
            font-size: 1rem;
            color: #555;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="detail-container">
    <h1 id="techFeedHeading"></h1>
    <h2 id="skillName"></h2>
    <p id="techFeedDescription"></p>
    <p>
        <!-- <strong>Views:</strong>  -->
        <ion-icon name="eye-outline"></ion-icon><span id="techFeedViewCount"></span></p>
</div>

<script>
    // Function to get URL parameters
    function getUrlParameter(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
    }

    // Fetch tech feed details
    function loadTechFeedDetails() {
        const techFeedID = getUrlParameter('TechFeedID');
        const userID = 0; // Temporarily hard-coded LoggedInUserID

        fetch(`https://reevaltech.com/scripts/getTechFeedDetailsService.php?TechFeedID=${techFeedID}&LoggedInUserID=${userID}`)
            .then(response => response.json())
            .then(responseData => {
                console.log("Tech Feed Details Response:", responseData);

                // Check if response is successful
                if (responseData.status) {
                    // Parse the data string into a JSON object
                    const techFeedDetailsArray = JSON.parse(responseData.data);
                    
                    // Access the first item in the array (assuming TechFeedID is unique)
                    const techFeedDetails = techFeedDetailsArray[0];
                    
                    // Display details if techFeedDetails is correctly parsed
                    if (techFeedDetails) {
                        document.getElementById('techFeedHeading').innerText = techFeedDetails.TechFeedHeading || 'No Heading Available';
                        document.getElementById('skillName').innerText = techFeedDetails.SkillName || 'No Skill Name Available';
                        document.getElementById('techFeedDescription').innerText = techFeedDetails.TechFeedDetail || 'No Description Available';
                        document.getElementById('techFeedViewCount').innerText = techFeedDetails.TechFeedViewCount || '0';
                    } else {
                        document.querySelector('.detail-container').innerHTML = "<p>No details found for this tech feed.</p>";
                    }
                } else {
                    document.querySelector('.detail-container').innerHTML = "<p>Error: " + responseData.message + "</p>";
                }
            })
            .catch(error => {
                console.error("Error fetching tech feed details:", error);
                document.querySelector('.detail-container').innerHTML = "<p>Error loading details.</p>";
            });
    }

    // Load tech feed details on page load
    loadTechFeedDetails();
</script>

</body>
</html>
